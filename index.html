var HL={en:"en",zh:"zh-CN",vi:"vi"};
function apply(l){
  document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=T[l][el.dataset.i18n]});
  document.documentElement.lang=HL[l];
  document.title=T[l].title;
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l)});
}
var cur="en";
try{var s=localStorage.getItem("lang");if(s&&T[s])cur=s;}catch(e){}
apply(cur);
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click",function(){cur=b.dataset.lang;apply(cur);try{localStorage.setItem("lang",cur)}catch(e){}});
});
(function(){
  var root=document.documentElement;
  try{var t=localStorage.getItem("theme");if(t)root.setAttribute("data-theme",t);}catch(e){}
  document.getElementById("theme").addEventListener("click",function(){
    var d=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    var n=d?"light":"dark";root.setAttribute("data-theme",n);
    try{localStorage.setItem("theme",n)}catch(e){}
  });
})();
</script>
